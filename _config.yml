title: AudienceKit
tagline: Make a Scene.
description: >-
  AudienceKit is the platform for building apps for a community: its own name,
  domain and look, with the venues, events and people that make it real.
url: https://audiencekit.com
baseurl: ""
lang: en_US

docs_url: https://developer.audiencekit.com
github_url: https://github.com/lwm-luminx
contact_email: hello@audiencekit.com

# Google Analytics 4 measurement id (AudienceKit property; the same stream covers the docs and console).
# Only emitted in production builds, which is what GitHub Pages runs.
google_analytics: G-W5LTH459WQ

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - mise.toml
  - vendor
  - scripts

# Legal pages (privacy, terms, data deletion).
legal_name: Love Wins Media Inc.
governing_law: the State of Washington, USA
legal_updated: 2026-10-16

# Parent brand: the "A Love Wins Media product" band (top of every page) and footer line.
parent_name: Love Wins Media
parent_url: https://lovewins.media
